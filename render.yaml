services:
  - type: web
    name: hosos-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm --filter @hosos/web start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: "HosOS Enterprise"
      - key: NEXT_PUBLIC_API_URL
        value: "https://hosos.onrender.com"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://hosos.onrender.com"
